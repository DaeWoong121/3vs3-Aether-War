# Aether War 설정. 수치는 경기 후 여기서 조절하고 /aw reload 하세요.
game:
  phase-minutes: 30          # 페이즈 하나의 길이 (3페이즈 = 90분)
  target-ether: 1000         # 코어 목표치
  ether-per-crystal: 5       # 결정 1개 납품 가치
  ether-per-refined: 15
  hits-per-harvest: 3        # 노드를 몇 번 쳐야 결정이 나오는지
  node-respawn-seconds: 20   # 캔 노드가 다시 생기는 시간
  capture-seconds: 8         # 점령 노드 점령에 필요한 시간
  surge-every-minutes: 10    # 2페이즈 균열 폭주 간격 (35, 45, 55분)
  guardian-health: 60
  guardian-drop-min: 5
  guardian-drop-max: 8
  great-rift-minutes: 10     # 마지막 몇 분에 대균열이 열리는지
  respawn-seconds: 10
  base-damage-reduction: 0.3 # 자기 기지 안에서 받는 피해 감소
  underdog-bonus: 0.25       # 인원이 적은 팀 납품 보너스
  raid-ether-per-hit: 10     # 3페이즈 코어 약탈 1타당 에테르
  raid-cap-fraction: 0.2     # 한 번의 약탈로 잃을 수 있는 최대 비율
  shield-seconds: 60
  contribution-per-point: 100 # 기여도 몇 점마다 스킬 포인트 1

arena:
  world: aether_arena

resource-pack:
  # 저장소에 올라간 리소스팩. 직접 호스팅하면 주소를 바꾸세요.
  url: https://raw.githubusercontent.com/DaeWoong121/3vs3-Aether-War/main/resourcepack/AetherWar-pack.zip
  sha1: ""          # 비워두면 서버 시작 때 자동으로 계산
  required: true    # 거절하면 접속 불가

skills:
  starting-points: 1
  respec-crystals: 10

boss:
  enabled: true
  health: 500
  reward-ether: 120
  reward-crystals: 8
  buff-seconds: 180

lobby:
  auto-build: true          # 맵은 있는데 로비가 없으면 서버 켤 때 자동으로 짓기
  height: 140               # 맵 가운데 위 로비 섬 높이
  countdown-seconds: 10     # 모두 준비하면 시작까지
  return-seconds: 20        # 경기 끝나고 로비로 돌아가기까지
